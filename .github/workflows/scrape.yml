name: Scrape vlr.gg

on:
  # 毎日 JST 6時 (UTC 21:00 前日) と 18時 (UTC 09:00) の2回実行
  schedule:
    - cron: '0 21 * * *'   # JST 06:00
    - cron: '0 9 * * *'    # JST 18:00
  # 手動でも実行できるように
  workflow_dispatch:
    inputs:
      mode:
        description: 'Scrape mode'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - upcoming
          - results
      pages:
        description: 'Result pages (results モード時のみ)'
        required: false
        default: '2'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Write Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is not set"
            exit 1
          fi
          mkdir -p scripts
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > scripts/serviceAccountKey.json
          # 軽い妥当性チェック
          python -c "import json; json.load(open('scripts/serviceAccountKey.json'))"

      - name: Run scraper
        run: |
          MODE="${{ github.event.inputs.mode || 'all' }}"
          PAGES="${{ github.event.inputs.pages || '2' }}"
          if [ "$MODE" = "results" ]; then
            python scripts/scraper.py results "$PAGES"
          else
            python scripts/scraper.py "$MODE"
          fi

      - name: Cleanup secret file
        if: always()
        run: rm -f scripts/serviceAccountKey.json
